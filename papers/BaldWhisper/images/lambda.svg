<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -20 440 300">
  <!-- Grid (light) -->
  <g stroke="#eee" stroke-width="1">
    <line x1="0" y1="0" x2="360" y2="0"/>
    <line x1="0" y1="50" x2="360" y2="50"/>
    <line x1="0" y1="100" x2="360" y2="100"/>
    <line x1="0" y1="150" x2="360" y2="150"/>
    <line x1="0" y1="200" x2="360" y2="200"/>
  </g>

  <!-- Axes -->
  <g stroke="black" stroke-width="2">
    <!-- Y axis -->
    <line x1="0" y1="200" x2="0" y2="-5"/>
    <!-- X axis -->
    <line x1="0" y1="200" x2="360" y2="200"/>
    <!-- Arrows -->
    <polygon points="0,-15 -5,-5 5,-5" fill="black"/>
    <polygon points="360,200 350,195 350,205" fill="black"/>
  </g>

  <!-- Learning rate curve -->
  <path d="M 0,50 L 144,50 L 180,200 L 360,200" 
        stroke="black" 
        stroke-width="2.5"
        fill="none"/>

  <!-- Y axis labels -->
  <g font-family="Arial" font-size="21" text-anchor="end">
    <text x="-10" y="205">0.0</text>
    <text x="-10" y="55">1.0</text>
    <text x="-10" y="20">λ</text>
  </g>

  <!-- X axis labels -->
  <g font-family="Arial" font-size="21" text-anchor="middle" fill="#666">
    <text x="0" y="240">0.0</text>
    <text x="135" y="240">0.4</text>
    <text x="190" y="240">0.5</text>
    <text x="360" y="240">1.0</text>
  </g>

  <!-- Tick marks -->
  <g stroke="black" stroke-width="2">
    <line x1="0" y1="195" x2="0" y2="205"/>
    <line x1="144" y1="195" x2="144" y2="205"/>
    <line x1="180" y1="195" x2="180" y2="205"/>
    <line x1="360" y1="195" x2="360" y2="205"/>
  </g>
</svg>
